<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoke Log | Transmission incoming</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A0A;
      color: #8FD694;
      font-family: "Courier New", monospace;
      text-align: center;
      padding: 2rem;
    }
    .box { max-width: 560px; }
    .stardate { color: #F4C430; letter-spacing: 0.2em; font-size: 0.8rem; margin-bottom: 1.5rem; }
    h1 { font-size: 2.4rem; margin-bottom: 1rem; color: #F4C430; }
    p { line-height: 1.7; margin-bottom: 1rem; }
    .blink { animation: blink 1.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    a { color: #F4C430; }
  </style>
</head>
<body>
  <div class="box">
    <div class="stardate">YOKE LOG // INCOMING TRANSMISSION</div>
    <h1>Log in progress<span class="blink">_</span></h1>
    <p>Yoke is about to go live. Tech news, notes and field reports from the support desk are being prepared for launch.</p>
    <p>Check back soon, or get in touch at <a href="mailto:hello@yoke.co.za">hello@yoke.co.za</a>.</p>
  </div>
</body>
</html>
