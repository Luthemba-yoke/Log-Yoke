<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">YOKE LOG<span class="cursor">_</span></a>
      <span class="tagline">{{ .Site.Params.tagline }}</span>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ now.Year }} Yoke Log. Contact: <a href="mailto:hello@yoke.co.za">hello@yoke.co.za</a></p>
    </div>
  </footer>
</body>
</html>
